name: Build Hishab Kitab APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      # নতুন প্যাকেজ নাম দিয়ে প্রজেক্ট রি-কনফিগার করা
      - name: Create Flutter Project
        run: |
          flutter create --project-name=hishab_kitab --org=com.hishabkitab --platforms android .

      # অ্যান্ড্রয়েড ৮.১ এর জন্য কম্প্যাটিবিলিটি এবং প্যাকেজ আইডি ফিক্স
      - name: Configure Android Manifest and SDK
        run: |
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle
          sed -i 's/targetSdkVersion .*/targetSdkVersion 33/' android/app/build.gradle
          sed -i 's/applicationId .*/applicationId "com.hishabkitab.app"/' android/app/build.gradle

      - name: Get Dependencies
        run: flutter pub get

      # এপিকে বিল্ড করা
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hishab-Kitab-Final
          path: build/app/outputs/flutter-apk/app-release.apk
