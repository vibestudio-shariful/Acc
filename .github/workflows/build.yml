name: Setup and Build Hishab Kitab

on:
  push:
    branches: [ main ]

# এটি গিটহাবকে আপনার রিপোজিটরিতে ফাইল লেখার অনুমতি দেবে
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      # অ্যাপের নাম এবং প্যাকেজ আইডি দিয়ে প্রজেক্ট তৈরি
      - name: Create Missing Files
        run: |
          flutter create --project-name=hishab_kitab --org=com.hishabkitab --platforms android .
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle
          sed -i 's/targetSdkVersion .*/targetSdkVersion 33/' android/app/build.gradle
          sed -i 's/applicationId .*/applicationId "com.hishabkitab.app"/' android/app/build.gradle

      # এই ধাপটি আপনার রিপোজিটরিতে ফাইলগুলো সেভ করে দেবে
      - name: Save Files to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Permanent Save: Android and Config Files Added" || echo "No changes to commit"
          git push

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hishab-Kitab-App
          path: build/app/outputs/flutter-apk/app-release.apk
