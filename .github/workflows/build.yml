name: Build Hishab Kitab Debug APK

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      # প্যাকেজ নাম এবং অ্যাপ নাম সেট করা
      - name: Create Missing Files
        run: |
          flutter create --project-name=hishab_kitab --org=com.hishabkitab --platforms android .
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle
          sed -i 's/targetSdkVersion .*/targetSdkVersion 33/' android/app/build.gradle
          sed -i 's/applicationId .*/applicationId "com.hishabkitab.app"/' android/app/build.gradle

      # ফাইলগুলো রিপোজিটরিতে সেভ করা
      - name: Save Files to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Save Android files for Debug Build" || echo "No changes"
          git push

      - name: Get Dependencies
        run: flutter pub get

      # এখানে 'debug' বিল্ড কমান্ড ব্যবহার করা হয়েছে
      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Hishab-Kitab-Debug
          path: build/app/outputs/flutter-apk/app-debug.apk
